<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Générateur de Squelettes — V3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172033;font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.45}header{background:#111827;color:#fff;padding:26px 18px}header div,main,footer{max-width:1100px;margin:auto}h1{margin:0 0 6px;font-size:clamp(25px,5vw,40px)}header p{margin:0;color:#d1d5db}.card,.result{background:#fff;border:1px solid #d9dee7;border-radius:15px;padding:17px;margin:16px 0;box-shadow:0 2px 8px #00000008}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}label{font-weight:700;font-size:14px}input,select{width:100%;margin-top:5px;padding:10px;border:1px solid #cbd2dc;border-radius:9px;font:inherit;background:#fff}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}@media(max-width:600px){.checks{grid-template-columns:1fr 1fr}}.check{border:1px solid #d9dee7;padding:9px;border-radius:9px;background:#fafafa}.check input{width:auto;margin:0 6px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}button{border:0;border-radius:9px;padding:11px 14px;font:inherit;font-weight:800;background:#4f46e5;color:#fff;cursor:pointer}button.secondary{background:#e7eaf0;color:#172033}button.green{background:#0f766e}.small{color:#667085;font-size:13px}.result h3{margin:0 0 5px;font-size:21px}.badges{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.badge{background:#eef2ff;color:#3730a3;border-radius:99px;padding:4px 9px;font-size:12px;font-weight:800}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:650px){.cols{grid-template-columns:1fr}}.box{background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:11px}.box strong{display:block;margin-bottom:4px}.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.step{background:#111827;color:#fff;padding:7px 9px;border-radius:8px;font-size:12px;font-weight:700}.arrow{font-weight:900;color:#98a2b3}.warning{background:#fff4f2;border-left:4px solid #d92d20;padding:9px;margin-top:10px}.ok{background:#ecfdf3;border-left:4px solid #12b76a;padding:9px;margin-top:10px}.empty{text-align:center;color:#667085;padding:20px}footer{padding:0 18px 30px;color:#667085;font-size:12px}@media print{header{background:#fff;color:#000;border-bottom:2px solid #000}header p{color:#000}.no-print,footer{display:none!important}body{background:#fff}.card,.result{box-shadow:none;break-inside:avoid}}
</style></head><body>
<header><div><h1>🎲 Générateur de Squelettes de Grands Jeux — V3</h1><p>Construis l’architecture du jeu avant son habillage.</p></div></header>
<main>
<section class="card no-print"><h2>1. Contraintes</h2><div class="grid">
<label>Enfants<input id="kids" type="number" min="6" max="500" value="80"></label>
<label>Durée (min)<input id="duration" type="number" min="15" max="300" value="120"></label>
<label>Animateurs<input id="animators" type="number" min="1" max="100" value="10"></label>
<label>Âge<select id="age"><option value="young">6–8 ans</option><option value="middle" selected>8–10 ans</option><option value="old">10–12 ans</option><option value="mixed">6–12 ans</option></select></label>
<label>Mobilité<select id="mobility"><option value="low">Faible</option><option value="medium" selected>Moyenne</option><option value="high">Forte</option></select></label>
<label>Matériel<select id="material"><option value="low">Faible</option><option value="medium" selected>Moyen</option><option value="high">Important</option></select></label>
<label>Élimination<select id="elim"><option value="none" selected>Aucune</option><option value="soft">Temporaire / douce</option><option value="hard">Oui</option></select></label>
<label>Thème<input id="theme" value="Le manoir mystérieux"></label>
<label>Priorité narrative<select id="story"><option value="low">Faible</option><option value="medium" selected>Moyenne</option><option value="high">Forte</option></select></label>
</div><h3>Ce que tu veux faire ressentir</h3><div class="checks">
<label class="check"><input type="checkbox" value="story">Histoire</label><label class="check"><input type="checkbox" value="strategy">Stratégie</label><label class="check"><input type="checkbox" value="coop">Coopération</label><label class="check"><input type="checkbox" value="competition">Compétition</label><label class="check"><input type="checkbox" value="explore">Exploration</label><label class="check"><input type="checkbox" value="investigate">Enquête</label><label class="check"><input type="checkbox" value="physical">Physique</label><label class="check"><input type="checkbox" value="creative">Créativité</label><label class="check"><input type="checkbox" value="resources">Ressources</label><label class="check"><input type="checkbox" value="factions">Factions</label>
</div><div class="actions"><button id="go">⚙️ Générer 5 architectures</button><button id="surprise" class="green">🎲 Surprise</button><button id="print" class="secondary">🖨️ Imprimer / PDF</button></div><div id="status" class="small"></div></section>
<section class="card"><h2>2. Résultats</h2><div id="out" class="empty">Les résultats apparaîtront ici.</div></section>
</main><footer>V3 — fichier autonome : aucune API, aucune bibliothèque externe, aucun compte nécessaire.</footer>
<script>
(function(){
const $=id=>document.getElementById(id), all=s=>[...document.querySelectorAll(s)];
const S={
hub:["A04","Hub des missions","Parcours","coop strategy resources","Une base centrale distribue plusieurs missions parallèles.","Mission → résultat → retour → nouvelle mission","Jetons / objets / informations","Accumulation finale"],
rotation:["A05","Rotation de stations","Parcours","physical competition coop","Les équipes commencent à des postes différents et tournent selon un ordre contrôlé.","Épreuve → résultat → rotation","Points / tampons","Objectif commun ou classement"],
tree:["A02","Arbre à convergence","Parcours","story strategy investigate","Les équipes choisissent entre plusieurs branches qui convergent vers une finale.","Choix → épreuve → conséquence","Indices / clés","Finale multi-étapes"],
network:["A03","Graphe de missions","Parcours","strategy investigate explore","Plusieurs missions sont disponibles et les résultats débloquent de nouvelles possibilités.","Choisir → accomplir → débloquer","Indices / clés","Déblocage final"],
territories:["C03","Territoires","Exploration","factions strategy competition explore","Le terrain est divisé en zones à explorer, contrôler, défendre ou libérer.","Entrer → agir → contrôler","Territoires / points","Conquête ou objectif collectif"],
investigation:["D02","Enquête en réseau","Enquête","investigate story explore","Les indices sont dispersés : aucune zone ne contient seule toute la solution.","Chercher → obtenir → recouper","Indices","Résolution"],
collection:["E05","Collection de fragments","Ressources","explore resources coop","Des fragments dispersés prennent leur vraie valeur une fois réunis.","Obtenir → conserver → combiner","Fragments","Assemblage final"],
economy:["E02","Économie de jeu","Ressources","strategy resources competition","Les missions produisent une monnaie que les équipes doivent gérer.","Mission → gain → choix → investissement","Monnaie / ressources","Objectif économique"],
factions:["G01","Factions asymétriques","Factions","factions strategy competition story","Les groupes ont des objectifs ou pouvoirs différents dans un même monde.","Objectif → action → conséquence","Pouvoirs / territoires","Confrontation ou objectifs croisés"],
countdown:["H01","Compte à rebours","Temps","physical story coop","Le temps est une ressource et des événements modifient régulièrement la partie.","Agir avant l’événement","Temps","Mission à temps limité"],
threat:["H02","Menace croissante","Temps","story coop physical","Une menace évolue pendant la partie et oblige les enfants à s’adapter.","Mission → menace → adaptation","Temps / protections","Boss ou survie"],
construction:["E04","Construction collective","Ressources","creative coop resources","Les missions rapportent des éléments permettant de construire progressivement une solution.","Mission → pièce → construction","Matériaux / pièces","Activation finale"],
boss:["J01","Boss progressif","Combat","story coop physical strategy","Une menace centrale possède plusieurs états ; les réussites révèlent et exploitent ses faiblesses.","Mission → faiblesse → affaiblissement","Pouvoirs / faiblesses","Affrontement final"],
tournament:["B04","Tournoi","Épreuves","competition physical strategy","Série d’épreuves avec rotation, score et finale.","Épreuve → score → rotation","Points","Finale compétitive"],
puzzle:["D03","Puzzle collectif","Enquête","investigate coop creative","Chaque équipe possède une partie de l’information ; la solution exige de réunir les pièces.","Trouver → échanger → assembler","Pièces d’information","Puzzle final"]
};
const R=[
["Le Hub évolutif",["hub","economy","threat"]],["L’Expédition mystérieuse",["network","investigation","countdown"]],
["La Guerre des territoires",["territories","factions","economy"]],["Le Manoir à menace croissante",["hub","threat","boss"]],
["La Grande enquête",["investigation","network","puzzle"]],["La Cité à construire",["collection","construction","countdown"]],
["Le Tournoi des factions",["factions","tournament","economy"]],["La Chasse aux fragments",["collection","network","countdown"]],
["L’Arbre des décisions",["tree","investigation","boss"]],["La Mission impossible",["countdown","hub","boss"]]
];
function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function data(){return{kids:+$("kids").value||80,duration:+$("duration").value||120,animators:+$("animators").value||10,age:$("age").value,mob:$("mobility").value,mat:$("material").value,elim:$("elim").value,theme:$("theme").value||"ton univers",story:$("story").value,prefs:all("input[type=checkbox]:checked").map(x=>x.value)}}
function score(r,d){let s=0,txt=r[1].flatMap(k=>S[k][3].split(" "));d.prefs.forEach(p=>{if(txt.includes(p))s+=3});if(d.kids>=70&&(r[1].includes("hub")||r[1].includes("territories")))s+=2;if(d.mob==="low"&&(r[1].includes("hub")||r[1].includes("investigation")))s+=2;if(d.mob==="high"&&(r[1].includes("territories")||r[1].includes("tournament")))s+=2;if(d.mat==="low"&&!r[1].includes("construction"))s+=2;if(d.story==="high"&&(r[1].includes("threat")||r[1].includes("boss")||r[1].includes("investigation")))s+=3;if(d.age==="young"&&r[1].includes("investigation"))s-=1;if(d.elim==="none"&&r[1].includes("tournament"))s-=1;return s}
function make(d){return R.map(r=>[r,score(r,d)]).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0])}
function render(r,d,i){
let team=Math.max(1,Math.ceil(d.kids/Math.min(10,Math.max(6,Math.ceil(d.kids/12))))), warns=[];
if(d.animators<Math.ceil(d.kids/20))warns.push("Effectif d’animateurs faible pour ce nombre d’enfants : simplifier les postes.");
if(d.duration<45&&d.kids>60)warns.push("Durée courte pour un grand groupe : privilégier une boucle très simple.");
if(d.mat==="low"&&d.prefs.includes("creative"))warns.push("Prévoir des créations avec papier, objets récupérés ou matériel réutilisable.");
if(d.elim==="hard")warns.push("Prévoir un rôle de retour pour éviter des enfants inactifs.");
if(d.age==="young"&&r[1].includes("factions"))warns.push("À 6–8 ans, garder les règles de factions très visuelles et courtes.");
if(d.kids>=100&&r[1].includes("investigation"))warns.push("Dupliquer les indices pour éviter les files.");
let ss=r[1].map(k=>S[k]), final=ss[ss.length-1][7];
return `<article class="result"><h3>${i+1}. ${esc(r[0])}</h3><div class="badges"><span class="badge">${esc(d.theme)}</span><span class="badge">≈ ${team} équipes</span><span class="badge">${esc(ss.map(x=>x[2]).filter((x,i,a)=>a.indexOf(x)<i).join(" • "))}</span></div><p>${esc(ss.map(x=>x[5]).join("  "))}</p><div class="cols"><div class="box"><strong>🧩 Squelettes</strong>${ss.map(x=>`<div><b>${x[0]}</b> — ${esc(x[1])}</div>`).join("")}</div><div class="box"><strong>🔁 Boucle principale</strong>${esc(ss.map(x=>x[6]).join(" → "))}</div><div class="box"><strong>🎒 Ressources</strong>${esc([...new Set(ss.map(x=>x[7]))].join(" • "))}</div><div class="box"><strong>🏁 Finale</strong>${esc(final)}<br><span class="small">${d.animators} animateur(s) disponibles ; répartir coordination et postes selon le terrain.</span></div></div>${warns.length?`<div class="warning"><b>⚠ À surveiller</b><ul>${warns.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>`:`<div class="ok">✓ Architecture compatible avec les contraintes principales.</div>`}<h4>Flux</h4><div class="flow">${ss.flatMap(x=>x[1]).slice(0,6).map((x,j)=>(j?'<span class="arrow">→</span>':'')+`<span class="step">${esc(x)}</span>`).join("")}</div></article>`
}
function generate(){let d=data(),v=make(d);$("status").textContent=`${v.length} architectures générées — ${d.kids} enfants · ${d.duration} min · ${d.animators} animateurs.`;$("out").innerHTML=v.map((r,i)=>render(r,d,i)).join("")}
$("go").onclick=generate;$("print").onclick=()=>window.print();$("surprise").onclick=()=>{let t=["Le manoir mystérieux","La cité céleste","L’île des pirates","Le laboratoire interdit","Le royaume des ombres","La station spatiale"];$("theme").value=t[Math.floor(Math.random()*t.length)];all("input[type=checkbox]").forEach(x=>x.checked=Math.random()<.3);if(!all("input[type=checkbox]:checked").length)$("input[value=coop]").checked=true;generate()};generate();
})();
</script></body></html>
